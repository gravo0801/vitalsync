openapi: 3.1.0
info:
  title: VitalSync Workout API
  version: 1.1.0
security:
  - bearerAuth: []
  description: 최근 운동 조회, 종목별 이력 조회, 확정 운동 저장 API
servers:
  - url: https://vitalsync-sigma.vercel.app
paths:
  /api/workouts/recent:
    get:
      operationId: getRecentWorkoutSessions
      summary: 최근 운동 세션과 종목별 최신 기록 조회
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: 최근 운동 기록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/workouts/exercises/recent:
    get:
      operationId: getRecentExerciseHistory
      summary: 특정 운동 종목의 최근 중량·횟수·세트 조회
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: 종목별 최근 기록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: 해당 종목 기록 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workouts/{workoutId}:
    get:
      operationId: getWorkoutById
      summary: workoutId로 운동 상세 조회
      parameters:
        - name: workoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 운동 상세 기록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: 운동 기록 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workouts:
    get:
      operationId: listWorkoutSessions
      summary: 운동 세션 목록 조회
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: 운동 세션 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: saveConfirmedWorkout
      summary: 사용자가 저장을 확인한 운동 기록 저장
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutSaveRequest"
      responses:
        "201":
          description: 새 운동 저장 완료
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "200":
          description: 동일 idempotency key 기록이 이미 존재함
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: 확정되지 않았거나 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: VitalSync API key
  schemas:
    StrengthSet:
      type: object
      required: [setNumber, reps]
      properties:
        setNumber:
          type: integer
        weightKg:
          type: [number, "null"]
        reps:
          type: [integer, "null"]
        machineBaseWeightKg:
          type: [number, "null"]
        machineBaseWeightEstimated:
          type: boolean
        addedWeightKg:
          type: [number, "null"]
        estimated:
          type: boolean
        notes:
          type: string
    StrengthExercise:
      type: object
      required: [exerciseName, sets]
      properties:
        exerciseName:
          type: string
        canonicalExerciseId:
          type: string
        sets:
          type: array
          items:
            $ref: "#/components/schemas/StrengthSet"
        notes:
          type: string
    CardioExercise:
      type: object
      required: [exerciseName]
      properties:
        exerciseName:
          type: string
        activityType:
          type: string
          enum: [cardio, stretching, mobility]
          default: cardio
          description: 유산소, 스트레칭, 모빌리티를 구분한다. 기존 요청에서 생략하면 운동명으로 추론한다.
        durationMin:
          type: [number, "null"]
        speedKmh:
          type: [number, "null"]
        distanceKm:
          type: [number, "null"]
        inclinePercent:
          type: [number, "null"]
        notes:
          type: string
    WorkoutSaveRequest:
      type: object
      required: [confirmedByUser, date, type]
      properties:
        confirmedByUser:
          type: boolean
          const: true
        workoutId:
          type: string
        idempotencyKey:
          type: string
        idempotencyRequestId:
          type: string
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        type:
          type: string
        category:
          type: string
          enum: [personal, PT]
          default: personal
        duration:
          type: [number, "null"]
          description: 전체 운동시간(분). 세부 활동시간의 합계와 구분한다.
        durationEstimated:
          type: boolean
          description: duration이 실제 측정값이 아닌 추정값이면 true
        startedAt:
          type: [string, "null"]
          description: 운동 시작 시각. ISO 8601 또는 HH:mm
        endedAt:
          type: [string, "null"]
          description: 운동 종료 시각. ISO 8601 또는 HH:mm
        strengthExercises:
          type: array
          items:
            $ref: "#/components/schemas/StrengthExercise"
        cardioExercises:
          type: array
          items:
            $ref: "#/components/schemas/CardioExercise"
        caloriesBurned:
          type: [number, "null"]
        rawMessages:
          type: array
          items:
            type: string
        location:
          type: string
        notes:
          type: string
    ErrorResponse:
      type: object
      required: [ok, error, message]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
